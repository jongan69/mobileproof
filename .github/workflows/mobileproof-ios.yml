name: Reusable iOS MobileProof

on:
  workflow_call:
    inputs:
      project-root:
        type: string
        default: .
      suite:
        type: string
        default: smoke

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install project dependencies
        working-directory: ${{ inputs.project-root }}
        run: npm ci
      - name: Install Maestro
        run: |
          curl -fsSLO https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.8.0/maestro.zip
          echo 'b3e561161904fb391875ca5834d5b22cf0b01c052dd1b408ad83e30d8f8951b3  maestro.zip' | shasum -a 256 --check
          unzip -q maestro.zip -d "$RUNNER_TEMP/mobileproof-maestro"
          echo "$RUNNER_TEMP/mobileproof-maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Boot simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.isAvailable == true)][0].udid')
          xcrun simctl boot "$DEVICE" || true
          open -a Simulator
      - name: Verify
        working-directory: ${{ inputs.project-root }}
        run: npx mobileproof run ${{ inputs.suite }} --platform ios
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mobileproof-ios
          path: ${{ inputs.project-root }}/.mobileproof/artifacts
          retention-days: 14
