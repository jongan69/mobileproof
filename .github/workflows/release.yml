name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm docs:build
      - run: pnpm --filter mobileproof publish --access public --provenance --no-git-checks
      - run: pnpm --filter mobileproof-react-native publish --access public --provenance --no-git-checks
