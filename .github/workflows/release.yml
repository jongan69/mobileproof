name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm docs:build
      - run: pnpm --filter mobileproof publish --access public --provenance --no-git-checks
      - run: pnpm --filter mobileproof-react-native publish --access public --provenance --no-git-checks
