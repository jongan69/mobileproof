name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm check
      - run: pnpm docs:build

  package:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./actions/setup
      - run: pnpm build
      - run: mkdir -p .mobileproof-package && pnpm --filter mobileproof pack --pack-destination .mobileproof-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobileproof-package
          path: .mobileproof-package/*.tgz
          retention-days: 7
