name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm check
      - run: pnpm docs:build

  package:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./actions/setup
      - run: pnpm build
      - run: mkdir -p .mobileproof-package && pnpm --filter mobileproof pack --pack-destination .mobileproof-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mobileproof-package
          path: .mobileproof-package/*.tgz
          retention-days: 7
