name: Reusable Android MobileProof

on:
  workflow_call:
    inputs:
      project-root:
        type: string
        default: .
      suite:
        type: string
        default: smoke

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install project dependencies
        working-directory: ${{ inputs.project-root }}
        run: npm ci
      - name: Install Maestro
        run: |
          curl -fsSLO https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.8.0/maestro.zip
          echo 'b3e561161904fb391875ca5834d5b22cf0b01c052dd1b408ad83e30d8f8951b3  maestro.zip' | sha256sum --check
          unzip -q maestro.zip -d "$RUNNER_TEMP/mobileproof-maestro"
          echo "$RUNNER_TEMP/mobileproof-maestro/maestro/bin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: ${{ inputs.project-root }}
          script: npx mobileproof run ${{ inputs.suite }} --platform android
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mobileproof-android
          path: ${{ inputs.project-root }}/.mobileproof/artifacts
          retention-days: 14
